name: Run Clang-Format Workflow (artdaq version)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
        against-ref:
            required: false
            type: string
        exclude-directories:
            required: false
            type: string

jobs:

 format_single_pkg:
    name: format single pkg
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      if: runner.os == 'Linux'
      run: |
        # Space usage before cleanup
        df -h /

        # Remove unused tool caches (comment any required ones with #)
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Verify gains
        df -h /

    - name: SUID for tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - uses: cvmfs-contrib/github-action-cvmfs@d93d881391926e8146776c13345c3e23d6393acd

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas

    - name: Checkout pkg
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}
        fetch-depth: 0

    - name: Fetch package version
      id: version
      run: |
        cd $GITHUB_WORKSPACE/scratch/${{ github.repository }}
        tag=`git describe --tags --abbrev=0`
        echo "Using tag $tag"
        echo "tag=${tag}" >>$GITHUB_OUTPUT

    - name: change dir permission
      run: |
        sudo mkdir -p /var/lib/cvmfs
        sudo chmod -R 777 /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs-${{ steps.version.outputs.tag }}

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs:cvmfs /var/lib/cvmfs
        sudo chmod -R 700 /var/lib/cvmfs

    - name: Pull current Docker image
      run: docker image pull ghcr.io/art-daq/artdaq-spack:latest

    - name: run clang-format in docker container with cvmfs bind mount
      run: |

        cd $GITHUB_WORKSPACE/scratch

        cat << EOT > format_pkg.sh
        #!/bin/bash

        cd /scratch/${{ github.repository }}
        git config --global --add safe.directory \$PWD

        excluded_dirs="${{ inputs.exclude-directories }}"
        exclude_regex="^(nothingtoseehere"

        for dir in \$excluded_dirs;do
          if [ -d \$dir ] || [ -f \$dir ]; then
            exclude_regex="\${exclude_regex}|\$dir"
          fi
        done
        if [ -f .git_whitespace_exclude ];then
          while read entry;do
            if [ "x\$entry" == "x" ]; then continue; fi
            if [ -d \$entry ] || [ -f \$entry ]; then
              exclude_regex="\${exclude_regex}|\$entry"
            fi
          done < .git_whitespace_exclude
        fi
        exclude_regex="\${exclude_regex})"
        echo "Excluding files from checks via \${exclude_regex}"

        against=${{ inputs.against-ref }}
        if [ "x\$against" == "x" ] || [ "x\$against" == "x0" ]; then
            against=\$(git hash-object -t tree /dev/null)
        fi
        echo "Checking for formatting issues introduced since commit \$against"

        names=\$( git diff --cached --name-only --diff-filter=AM  \$against | grep -vE "\${exclude_regex}" )

        if [ \${PIPESTATUS[0]} -ne 0 ]; then
            echo "Error running git diff command"
            echo "Error running git diff command" >>/scratch/art-daq/build.log
            exit 1
        fi

        if [ "x\$names" == "x" ]; then
            echo "No changed files"
            echo "No changed files" >>/scratch/art-daq/build.log
            exit 0
        fi

        # Setup Spack environment and load required packages
        source /opt/artdaq/setup-env.sh || exit 1
        spack load --first llvm
        spack load --first py-black

        files=()
        header_files=()
        pyfiles=()
        IFS_SAVE=\$IFS
        IFS=\$'\\n'
        for name in \$names;do
            bname=\$( basename \$name )
            ext=\$(echo \$bname | awk -F. '{if(NF==1) print ""; else print \$NF};' )
            if [[ "\$ext" == "cc" || "\$ext" == "C"  || "\$ext" == "cpp" || "\$ext" == "icc" \
               ]]; then
               files+=("\$name")
            fi
            if [[ "\$ext" == "hh" || "\$ext" == "h"  || "\$ext" == "hxx"  || "\$ext" == "hpp"  \
               ]]; then
               header_files+=("\$name")
            fi
            if [[ "\$ext" == "py" ]]; then
               pyfiles+=("\$name")
            fi
        done
        IFS=\$IFS_SAVE

        echo "Found \${#files[@]} changed source files, \${#header_files[@]} changed header files, and \${#pyfiles[@]} changed python files"
        echo "Source files: \${files[@]}"
        echo "Header files: \${header_files[@]}"
        echo "Python files: \${pyfiles[@]}"

        if [ \${#files[@]} -gt 0 ]; then
            echo "Running clang-format on changed files"
            clang-format -n -Werror "\${files[@]}"  2>&1 | tee -a /scratch/art-daq/build.log
            res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

            echo "Clang-format completed with status code \$res"
            echo "Clang-format completed with status code \$res" >>/scratch/art-daq/build.log
        else
            echo "No changed clang-format files"
            echo "No changed clang-format files" >>/scratch/art-daq/build.log
            res=0
        fi

        if [ \${#header_files[@]} -gt 0 ]; then
            echo "Running clang-format on changed header files"
            header_arg=""
            if [ -f .clang-format-hpp ]; then
                header_arg="--style=file:.clang-format-hpp"
            fi
            clang-format \$header_arg -n -Werror "\${header_files[@]}"  2>&1 | tee -a /scratch/art-daq/build.log
            res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

            echo "Clang-format headers completed with status code \$res"
            echo "Clang-format headers completed with status code \$res" >>/scratch/art-daq/build.log
        else
            echo "No changed clang-format header files"
            echo "No changed clang-format header files" >>/scratch/art-daq/build.log
            res=0
        fi

        if [ \${#pyfiles[@]} -gt 0 ]; then
            echo "Running black on changed python files"
            black --check "\${pyfiles[@]}" 2>&1 | tee -a /scratch/art-daq/build.log
            res_py=\${PIPESTATUS[0]} # Get result of first command

            echo "py-black completed with status code \$res_py"
            echo "py-black completed with status code \$res_py" >>/scratch/art-daq/build.log
        else
            echo "No changed python files"
            echo "No changed python files" >>/scratch/art-daq/build.log
            res_py=0
        fi

        exit \$(( \$res + \$res_py ))
        EOT
        chmod +x format_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch ghcr.io/art-daq/artdaq-spack:latest /scratch/format_pkg.sh

        grep "Clang-format completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed clang-format files" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed files" ${{ github.workspace }}/scratch/art-daq/build.log

        grep "Clang-format headers completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed clang-format header files" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed files" ${{ github.workspace }}/scratch/art-daq/build.log

        grep "py-black completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed python files" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed files" ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload build log file
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: change dir permission again
      run: |
        sudo chmod -R 777 /var/lib/cvmfs
