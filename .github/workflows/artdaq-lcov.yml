name: Create artdaq LCOV coverage report

permissions:
  contents: read

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  schedule:
    - cron: "0 0 * * 4"

  workflow_dispatch:

jobs:
  make_lcov_report:
    name: make_lcov_report
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      if: runner.os == 'Linux'
      run: |
        # Space usage before cleanup
        df -h /

        # Remove unused tool caches (comment any required ones with #)
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Verify gains
        df -h /

    - name: SUID for tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - uses: cvmfs-contrib/github-action-cvmfs@d93d881391926e8146776c13345c3e23d6393acd

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas

    - name: Checkout pkg
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: art-daq/artdaq
        path: scratch/art-daq/artdaq
        fetch-depth: 0

    - name: Fetch package version
      id: version
      run: |
        cd $GITHUB_WORKSPACE/scratch/art-daq/artdaq
        tag=`git describe --tags --abbrev=0`
        echo "Using tag $tag"
        echo "tag=${tag}" >>$GITHUB_OUTPUT

    - name: change dir permission
      run: |
        sudo mkdir -p /var/lib/cvmfs
        sudo chmod -R 777 /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs-${{ steps.version.outputs.tag }}

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs:cvmfs /var/lib/cvmfs
        sudo chmod -R 700 /var/lib/cvmfs

    - name: Pull current Docker image
      run: docker image pull ghcr.io/art-daq/artdaq-spack:latest

    - name: run build in docker container with cvmfs bind mount
      run: |

        cd $GITHUB_WORKSPACE/scratch
        cat << EOT > build_pkg.sh
        #!/bin/bash

        cd /opt/artdaq
        source /opt/artdaq/setupARTDAQDEMO || exit 1

        spack load lcov

        branch=develop

        echo "Checking out \$branch"
        cd  /opt/artdaq/srcs
        for pkg in */;do
            echo "Updating package \$pkg"
            cd \$pkg
            git stash
            git checkout \$branch
            git stash pop
            git pull
            cd ..
        done
        cd /opt/artdaq

        # Have to re-add here in case architecture is different
        cd /opt/artdaq
        spack config add config:mpd_user_dir:/opt/artdaq/spack-repos/mpd/

        export CETPKG_J=\$((`cat /proc/cpuinfo|grep processor|tail -1|awk '{print $3}'` + 1))
        export USE_GCOV=1
        export RUN_TESTS=1 # Run artdaq-database tests

        echo "Starting build"
        sed -i 's/RelWithDebInfo/Debug/g' srcs/CMakePresets.json
        spack mpd build -G Ninja -j\$CETPKG_J --clean 2>&1 | tee -a /scratch/art-daq/build.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

        echo "Spack install completed with status code \$res"
        echo "Spack install completed with status code \$res" >>/scratch/art-daq/build.log

        echo "Collecting coverage data"
        lcov -d build --zerocounters
        lcov -c --ignore-errors mismatch,mismatch --ignore-errors gcov,gcov -i -d build -o artdaq.base

        spack mpd test
        #run_integration_tests.sh --runduration 30

        lcov -d build --ignore-errors mismatch,mismatch --ignore-errors gcov,gcov --ignore-errors negative,negative --capture --output-file artdaq.info
        lcov -a artdaq.base -a artdaq.info --output-file artdaq.total
        lcov --remove artdaq.total --ignore-errors unused,unused '/cvmfs/*' 'boost/*' '*/spack/opt/spack/*' '*/spack/var/spack/*' '/usr/include/curl/*' 'artdaq-database/built-in/*' --output-file artdaq.info.cleaned
        genhtml -o coverage artdaq.info.cleaned

        mv coverage /scratch/art-daq

        exit \$res
        EOT
        chmod +x build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch ghcr.io/art-daq/artdaq-spack:latest /scratch/build_pkg.sh

        grep "Spack install completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload build log file
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: error
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found: error
        name: artdaq_code_coverage
        path: ${{ github.workspace }}/scratch/art-daq/coverage

    - name: change dir permission again
      if: always()
      run: |
        sudo chmod -R 777 /var/lib/cvmfs
