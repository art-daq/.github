name: Build otsdaq suite against develop

permissions:
  contents: read

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_call:

jobs:
  build_against_dev_release:
    name: build_against_dev
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      if: runner.os == 'Linux'
      run: |
        # Space usage before cleanup
        df -h /

        # Remove unused tool caches (comment any required ones with #)
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Verify gains
        df -h /

    - name: SUID for tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - uses: cvmfs-contrib/github-action-cvmfs@d93d881391926e8146776c13345c3e23d6393acd

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas

    - name: Checkout pkg
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}
        fetch-depth: 0

    - name: Fetch package version
      id: version
      run: |
        cd $GITHUB_WORKSPACE/scratch/${{ github.repository }}
        tag=`git describe --tags --abbrev=0`
        echo "Using tag $tag"
        echo "tag=${tag}" >>$GITHUB_OUTPUT

    - name: change dir permission
      run: |
        sudo mkdir -p /var/lib/cvmfs
        sudo chmod -R 777 /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs-${{ steps.version.outputs.tag }}

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs:cvmfs /var/lib/cvmfs
        sudo chmod -R 700 /var/lib/cvmfs

    - name: Pull current Docker image
      run: docker image pull ghcr.io/art-daq/otsdaq-spack:latest

    - name: run build in docker container with cvmfs bind mount
      run: |

        cd $GITHUB_WORKSPACE/scratch
        cat << EOT > build_pkg.sh
        #!/bin/bash

        cd /opt/otsdaq
        source /opt/otsdaq/setup_ots_rte.sh || exit 1

        export REPO=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')
        export pkgname=\${REPO//_/-}
        echo "Copying /scratch/art-daq/\$REPO to srcs \$pkgname"
        cd srcs
        if [ -d \$pkgname ];then mv \$pkgname{,.bak}; fi
        cp -pr /scratch/art-daq/\$REPO \$pkgname
        cd \$pkgname
        git config --global --add safe.directory \$PWD
        export ref=\$(git describe --all)
        echo "Described current ref as \${ref}"
        branch=develop

        if [[ "x\${ref}" =~ "xheads/" ]]; then
            echo "Setting branch to \${ref//heads\//}"
            branch=\${ref//heads\//}
        fi

        echo "Checking out \$branch"
        cd  /opt/otsdaq/srcs
        for pkg in */;do
            echo "Updating package \$pkg"
            cd \$pkg
            git stash
            git checkout \$branch
            git stash pop
            git pull
            cd ..
        done

        export OTS_DOXY="DOIT"
        # Have to re-add here in case architecture is different
        cd /opt/otsdaq
        spack config add config:mpd_user_dir:/opt/otsdaq/spack-repos/mpd/
        export CETPKG_J=\$((`cat /proc/cpuinfo|grep processor|tail -1|awk '{print $3}'` + 1))

        # Cleanup old docs
        rm -rf build/*/doc

        echo "Starting build"
        spack mpd build -G Ninja -j\$CETPKG_J 2>&1 | tee -a /scratch/art-daq/build.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

        if [ \$res -eq 0 ]; then
          cd build
          ninja install 2>&1 | tee -a /scratch/Mu2e/build.log
          res=\${PIPESTATUS[0]}
          cd ..
        fi

        echo "Spack install completed with status code \$res"
        echo "Spack install completed with status code \$res" >>/scratch/art-daq/build.log

        echo "Collecting Doxygen"
        mkdir -p /scratch/art-daq/docs && rm -rf /scratch/art-daq/docs/*
        for dir in /opt/otsdaq/build/*/doc/html;do
            thispkg=\`echo \$dir|sed 's|/opt/otsdaq/build/||;s|/doc/html||'\`
            echo "Copying \$dir to /scratch/art-daq/docs/\$thispkg"
            cp -a \$dir /scratch/art-daq/docs/\$thispkg
        done
        echo "Contents of docs after collection"
        ls /scratch/art-daq/docs

        exit \$res
        EOT
        chmod +x build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch ghcr.io/art-daq/otsdaq-spack:latest /scratch/build_pkg.sh

        grep "Spack install completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload build log file
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload Doxygen docs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: doxygen
        path: ${{ github.workspace }}/scratch/art-daq/docs

    - name: change dir permission again
      if: always()
      run: |
        sudo chmod -R 777 /var/lib/cvmfs
