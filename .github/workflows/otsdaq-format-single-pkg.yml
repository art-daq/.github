name: Run Clang-Format Workflow (artdaq version)

on:
  workflow_call:
    inputs:
        against-ref:
            required: false
            type: string

jobs:

 format_single_pkg:
    name: format single pkg
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache

    - uses: cvmfs-contrib/github-action-cvmfs@main

    - name: change dir permission
      run: |
        sudo chmod -R go+rwx /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@main
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs.cvmfs /var/lib/cvmfs
        sudo chmod -R go-rwx /var/lib/cvmfs

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas
    
    - name: Checkout pkg
      uses: actions/checkout@main
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}
        fetch-depth: 0

    - name: Update artdaq Image Cache if cache miss
      if: steps.cache-docker-artdaq.outputs.cache-hit != 'true'
      run: docker pull eflumerf/artdaq-spack:latest && mkdir -p ci/cache/docker/artdaq && docker image save eflumerf/artdaq-spack:latest --output ./ci/cache/docker/artdaq/artdaq-latest.tar

    - name: Use artdaq Image Cache if cache hit
      if: steps.cache-docker-artdaq.outputs.cache-hit == 'true'
      run: docker image load --input ./ci/cache/docker/artdaq/artdaq-latest.tar

    - name: Check for artdaq Image Cache Updates
      if: steps.cache-docker-artdaq.outputs.cache-hit == 'true'
      run: |
        newimage=`docker pull eflumerf/artdaq-spack:latest | grep -c  "Status: Downloaded newer image"`
        [ $newimage -eq 1 ] && docker image save eflumerf/artdaq-spack:latest --output ./ci/cache/docker/artdaq/artdaq-latest.tar

    - name: run clang-format in docker container with cvmfs bind mount
      run: |
      
        cd $GITHUB_WORKSPACE/scratch
                
        against=${{ inputs.against-ref }}
        if [ "x$against" == "x" ] || [ "x$against" == "x0" ]; then
            against=$(git hash-object -t tree /dev/null)
        fi
        echo "Collecting changed files since commit $against, in git repository ${{ github.repository }}"
        cd ${{ github.repository }}
        names=$( git diff --cached --name-only --diff-filter=AM  $against )

        if [ "x$names" == "x" ]; then
            echo "No changed files"
            echo "No changed files" >$GITHUB_WORKSPACE/scratch/art-daq/build.log
            exit 0
        fi
        echo "Changed files to format: $names"

        cd $GITHUB_WORKSPACE/scratch

        cat << EOT > build_pkg.sh
        #!/bin/bash
        
        cd /opt/artdaq
        source /opt/artdaq/setup-env.sh || exit 1
        
        export REPO=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')
        names="$names"
        
        cd /scratch/${{ github.repository }}
        
        spack load --first llvm
        
        files=""
        for name in \$names;do
            bname=\$( basename \$name )
            ext=\$(echo \$bname | awk -F. '{if(NF==1) print ""; else print \$NF};' )
            if [[ "\$ext" == "hh" || "\$ext" == "cc" \
               || "\$ext" == "C" ||  "\$ext" == "h" || "\$ext" == "icc"  || "\$ext" == "cpp" \
               ]]; then
               files="\$files \$name"
            fi
        done

        echo "Running clang-format on changed files"
        clang-format -n -Werror \$files  2>&1 | tee -a /scratch/art-daq/build.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

        echo "Clang-format completed with status code \$res"
        echo "Clang-format completed with status code \$res" >>/scratch/art-daq/build.log
        
        exit \$res
        EOT
        chmod +x build_pkg.sh
        cat build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch eflumerf/artdaq-spack:latest /scratch/build_pkg.sh
        
    - name: Check build log for success
      run: |
        grep "Clang-format completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log ||
        grep "No changed files" ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload build log file
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: change dir permission again
      run: |
        sudo chmod -R go+rwx /var/lib/cvmfs
