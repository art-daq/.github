name: Run artdaq suite integration tests

permissions:
  contents: read

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_call:

jobs:
  run_integ_tests:
    name: run_integ_tests
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - demo
          #- ascii_simulator_example
          #- circular_buffer_mode_example
          #- circular_buffer_mode_withRM
          #- complex_subsystems
          #- complicated_subsystems
          #- config_includes
          #- demo_largesystem
          #- eventbuilder_diskwriting
          #- file_closing_example
          #- mediumsystem_with_routing_manager
          #- mu2e_sample_system
          #- mu2e_stm_config
          #- multiple_art_processes_example
          #- multiple_dataloggers
          #- multiple_fragment_ids
          #- request_based_dataflow_example
          #- routing_manager_example
          #- simple_subsystems
          #- subrun_example

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      if: runner.os == 'Linux'
      run: |
        # Space usage before cleanup
        df -h /

        # Remove unused tool caches (comment any required ones with #)
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Verify gains
        df -h /

    - name: SUID for tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - uses: cvmfs-contrib/github-action-cvmfs@d79d292a9fc4a1d34fe5caa390308d0ec4ffe993

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas

    - name: Checkout pkg
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}
        fetch-depth: 0

    - name: Fetch package version
      id: version
      run: |
        cd $GITHUB_WORKSPACE/scratch/${{ github.repository }}
        tag=`git describe --tags --abbrev=0`
        echo "Using tag $tag"
        echo "tag=${tag}" >>$GITHUB_OUTPUT

    - name: change dir permission
      run: |
        sudo mkdir -p /var/lib/cvmfs
        sudo chmod -R 777 /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs-${{ steps.version.outputs.tag }}

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs:cvmfs /var/lib/cvmfs
        sudo chmod -R 700 /var/lib/cvmfs

    - name: Pull current Docker image
      run: docker image pull ghcr.io/art-daq/artdaq-spack:latest

    - name: run integration test in docker container with cvmfs bind mount
      run: |

        cd $GITHUB_WORKSPACE/scratch
        cat << EOT > build_pkg.sh
        #!/bin/bash

        cd /opt/artdaq
        source /opt/artdaq/artdaq_demo_rte.sh || exit 1

        cd  /opt/artdaq/srcs
        for pkg in */;do
            echo "Updating package \$pkg"
            cd \$pkg
            git stash
            git checkout \$branch
            git stash pop
            git pull
            cd ..
        done
        cd /opt/artdaq

        # Have to re-add here in case architecture is different
        cd /opt/artdaq
        spack config add config:mpd_user_dir:/opt/artdaq/spack-repos/mpd/

        # Cleanup old docs
        rm -rf build/*/doc

        export CETPKG_J=\$((`cat /proc/cpuinfo|grep processor|tail -1|awk '{print $3}'` + 1))
        echo "Starting build"
        spack mpd build -G Ninja -j\$CETPKG_J 2>&1 | tee -a /scratch/art-daq/${{ matrix.config }}.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

        if [ \$res -eq 0 ]; then
          cd build
          ninja install 2>&1 | tee -a /scratch/art-daq/${{ matrix.config }}.log
          res=\${PIPESTATUS[0]}
          cd ..
        fi

        echo "Spack install completed with status code \$res"
        echo "Spack install completed with status code \$res" >>/scratch/art-daq/${{ matrix.config }}.log

        run_integration_tests.sh --config ${{matrix.config}} -- --tmux 2>&1 | tee -a /scratch/art-daq/${{ matrix.config }}.log
        check_integration_tests.sh 2>&1 | tee -a /scratch/art-daq/${{ matrix.config }}.log

        grep -c "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!" /scratch/art-daq/${{ matrix.config }}.log
        grepcount=`grep -c "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!" /scratch/art-daq/${{ matrix.config }}.log`
        echo "grepcount=$grepcount"
        if [ ${grepcount:-1} -gt 0 ]; then
            echo "${{ matrix.config }} Integration test failed"
            res=1
        else
            echo "${{ matrix.config }} Integration test succeeded"
        fi

        exit \$res
        EOT
        chmod +x build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch ghcr.io/art-daq/artdaq-spack:latest /scratch/build_pkg.sh


        grep "Spack install completed with status code 0" ${{ github.workspace }}/scratch/art-daq/${{ matrix.config }}.log
        grep "${{ matrix.config }} Integration test succeeded" ${{ github.workspace }}/scratch/art-daq/${{ matrix.config }}.log

    - name: upload build log file
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.config }}_log
        path: ${{ github.workspace }}/scratch/art-daq/${{ matrix.config }}.log

    - name: change dir permission again
      if: always()
      run: |
        sudo chmod -R 777 /var/lib/cvmfs
