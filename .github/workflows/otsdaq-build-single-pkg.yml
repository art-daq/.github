name: Build Single Pkg Workflow (otsdaq version)

on:
  workflow_call:

jobs:

  build_single_pkg:
    name: build single pkg
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache

    - uses: cvmfs-contrib/github-action-cvmfs@main

    - name: change dir permission
      run: |
        sudo chmod -R go+rwx /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@main
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs.cvmfs /var/lib/cvmfs
        sudo chmod -R go-rwx /var/lib/cvmfs

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.orgproducts/artdaq/spack_areas

    - name: Checkout pkg
      uses: actions/checkout@main
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}

    - name: Restore otsdaq Image Cache if it exists
      id: cache-docker-otsdaq
      uses: actions/cache@v3
      with:
        path: ci/cache/docker/otsdaq
        key: cache-docker-otsdaq

    - name: Update otsdaq Image Cache if cache miss
      if: steps.cache-docker-otsdaq.outputs.cache-hit != 'true'
      run: docker pull eflumerf/otsdaq-spack:latest && mkdir -p ci/cache/docker/otsdaq && docker image save eflumerf/otsdaq-spack:latest --output ./ci/cache/docker/otsdaq/otsdaq-latest.tar

    - name: Use otsdaq Image Cache if cache hit
      if: steps.cache-docker-otsdaq.outputs.cache-hit == 'true'
      run: docker image load --input ./ci/cache/docker/otsdaq/otsdaq-latest.tar

    - name: Check for otsdaq Image Cache Updates
      if: steps.cache-docker-otsdaq.outputs.cache-hit == 'true'
      run: |
        newimage=`docker pull eflumerf/otsdaq-spack:latest | grep -c  "Status: Downloaded newer image"`
        [ $newimage -eq 1 ] && docker image save eflumerf/otsdaq-spack:latest --output ./ci/cache/docker/otsdaq/otsdaq-latest.tar

    - name: run build in docker container with cvmfs bind mount
      run: |

        cd $GITHUB_WORKSPACE/scratch
        cat << EOT > build_pkg.sh
        #!/bin/bash

        cd /opt/otsdaq
        source /opt/otsdaq/setup_otsdaq.sh || exit 1

        export REPO=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')
        mkdir /scratch/art-daq/build_\$REPO
        cd /scratch/art-daq/build_\$REPO

        export compiler=\$(spack compiler info gcc@13.1.0|grep cxx|awk '{print \$3}')
        echo "Compiler is \$compiler"
        cp /opt/otsdaq/srcs/CMakePresets.json /scratch/art-daq/\$REPO
        echo "Configuring with cmake --preset default /scratch/art-daq/\$REPO -DCMAKE_CXX_COMPILER=\$compiler -Wno-dev"
        cmake --preset default /scratch/art-daq/\$REPO -DCMAKE_CXX_COMPILER=\$compiler -Wno-dev

        echo "Starting build"
        make 2>&1 | tee -a /scratch/art-daq/build.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific

        echo "Spack install completed with status code \$res"
        echo "Spack install completed with status code \$res" >>/scratch/art-daq/build.log

        exit \$res
        EOT
        chmod +x build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch eflumerf/otsdaq-spack:latest /scratch/build_pkg.sh

    - name: Check build log for success
      run: |
        grep "Spack install completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log

    - name: upload build log file
      uses: actions/upload-artifact@main
      with:
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: change dir permission again
      run: |
        sudo chmod -R go+rwx /var/lib/cvmfs
