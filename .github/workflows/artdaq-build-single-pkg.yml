name: Build Single Pkg Workflow (artdaq version)

on:
  workflow_call:

jobs:

  build_single_pkg:
    name: build single pkg
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache

    - name: SUID for tar
      run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

    - uses: cvmfs-contrib/github-action-cvmfs@main

    - name: test cvmfs
      run: |
        ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_areas
    
    - name: Checkout pkg
      uses: actions/checkout@main
      with:
        repository: ${{ github.repository }}
        path: scratch/${{ github.repository }}
        fetch-depth: 0

    - name: Fetch package version
      id: version
      run: |
        cd $GITHUB_WORKSPACE/scratch/${{ github.repository }}
        tag=`git describe --tags --abbrev=0`
        echo "Using tag $tag"
        echo "tag=${tag}" >>$GITHUB_OUTPUT
        
    - name: change dir permission
      run: |
        sudo mkdir -p /var/lib/cvmfs
        sudo chmod -R 777 /var/lib/cvmfs

    - name: Cache cvmfs cache
      id: cvmfs_cache
      uses: actions/cache@main
      with:
        path: /var/lib/cvmfs/shared
        key: cachecvmfs-${{ steps.version.outputs.tag }}

    - name: restore dir permission
      run: |
        sudo chown -R cvmfs:cvmfs /var/lib/cvmfs
        sudo chmod -R 700 /var/lib/cvmfs

    - name: Pull current Docker image
      run: docker image pull ghcr.io/art-daq/artdaq-spack:latest

    - name: run build in docker container with cvmfs bind mount
      run: |
      
        cd $GITHUB_WORKSPACE/scratch
        cat << EOT > build_pkg.sh
        #!/bin/bash
        
        cd /opt/artdaq
        source /opt/artdaq/setupARTDAQDEMO || exit 1
        
        export REPO=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')
        mkdir /scratch/art-daq/build_\$REPO
        cd /scratch/art-daq/build_\$REPO
        
        export CETPKG_J=\$((`cat /proc/cpuinfo|grep processor|tail -1|awk '{print $3}'` + 1))
        export compiler=\$(spack compiler info gcc@13.1.0|grep cxx|awk '{print \$3}')
        echo "Compiler is \$compiler"
        cp /opt/artdaq/srcs/CMakePresets.json /scratch/art-daq/\$REPO
        echo "Configuring with cmake --preset default /scratch/art-daq/\$REPO -DCMAKE_CXX_COMPILER=\$compiler -Wno-dev"
        cmake --preset default /scratch/art-daq/\$REPO -DCMAKE_CXX_COMPILER=\$compiler -Wno-dev
        
        echo "Starting build"
        make -j\$CETPKG_J 2>&1 | tee -a /scratch/art-daq/build.log
        res=\${PIPESTATUS[0]} # Get result of first command in previous pipe, bash specific
        
        echo "Spack install completed with status code \$res"
        echo "Spack install completed with status code \$res" >>/scratch/art-daq/build.log
        mkdir -p /scratch/art-daq/docs
        cp -a /scratch/art-daq/build_\$REPO/doc/*.tag /scratch/art-daq/docs
        cp -a /scratch/art-daq/build_\$REPO/doc/header.html /scratch/art-daq/docs
        cp -a /scratch/art-daq/build_\$REPO/doc/Doxyfile /scratch/art-daq/docs

        exit \$res
        EOT
        chmod +x build_pkg.sh

        docker run --rm -v /cvmfs:/cvmfs:shared -v $GITHUB_WORKSPACE/scratch:/scratch ghcr.io/art-daq/artdaq-spack:latest /scratch/build_pkg.sh
        
    - name: Check build log for success
      run: |
        grep "Spack install completed with status code 0" ${{ github.workspace }}/scratch/art-daq/build.log
        
    - name: Doxygen Action
      uses: mattnotmitt/doxygen-action@v1.12.0
      with:
        working-directory: /github/workspace/scratch/art-daq/docs
        doxyfile-path: './Doxyfile'

    - name: upload build log file
      uses: actions/upload-artifact@main
      with:
        name: build_log
        path: ${{ github.workspace }}/scratch/art-daq/build.log

    - name: Rename Doxygen output
      run: |
        rm -rf ${{ github.workspace }}/scratch/art-daq/docs/${{ steps.version.outputs.repo }}
        mv ${{ github.workspace }}/scratch/art-daq/docs/html ${{ github.workspace }}/scratch/art-daq/docs/${{ steps.version.outputs.repo }}

    - name: upload Doxygen directory
      uses: actions/upload-artifact@main
      with:
        name: doxygen
        path: ${{ github.workspace }}/scratch/art-daq/docs/${{ steps.version.outputs.repo }}

    - name: change dir permission again
      run: |
        sudo chmod -R 777 /var/lib/cvmfs
